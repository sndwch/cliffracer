[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cliffracer-otel"
dynamic = ["version"]
description = "Distributed Tracing and OpenTelemetry instrumentation for cliffracer services"
requires-python = ">=3.11"
readme = "README.md"
# Hatchling auto-detects the LICENSE file. It must be copied, not symlinked,
# to avoid sdist unpacking errors.
license = {text = "MIT"}
dependencies = [
    "cliffracer",
    "opentelemetry-api>=1.20.0,<2.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/cliffracer_otel"]

[tool.uv.sources]
cliffracer = { workspace = true }
