[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cliffracer-backdoor"
dynamic = ["version"]
description = "Live debugging console for cliffracer services"
requires-python = ">=3.11"
readme = "README.md"
# Hatchling auto-detects the LICENSE file. It must be copied, not symlinked,
# to avoid sdist unpacking errors.
license = {text = "MIT"}
dependencies = [
    "cliffracer",
    "aioconsole>=0.7.0,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "psutil>=5.9.0,<8.0.0",
]

[project.scripts]
cliffracer-backdoor = "cliffracer_backdoor.cli:main"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/cliffracer_backdoor"]

[tool.uv.sources]
cliffracer = { workspace = true }
