[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cliffracer-kv"
dynamic = ["version"]
description = "NATS Key-Value and Object Store integration for cliffracer services"
requires-python = ">=3.11"
readme = "README.md"
# Hatchling auto-detects the LICENSE file. It must be copied, not symlinked,
# to avoid sdist unpacking errors.
license = {text = "MIT"}
dependencies = [
    "cliffracer",
    "nats-py>=2.6.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/cliffracer_kv"]

[tool.uv.sources]
cliffracer = { workspace = true }
