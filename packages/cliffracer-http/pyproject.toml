[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cliffracer-http"
dynamic = ["version"]
description = "HTTP routes and websockets for cliffracer services (FastAPI)"
requires-python = ">=3.11"
readme = "README.md"
# Hatchling auto-detects the LICENSE file. It must be copied, not symlinked,
# to avoid sdist unpacking errors.
license = {text = "MIT"}
dependencies = [
    "cliffracer",
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn[standard]>=0.23.0,<1.0.0",
    "starlette>=0.27.0,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/cliffracer_http"]

[tool.uv.sources]
cliffracer = { workspace = true }
