[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

# Explicit include allowlist for core's sdist to exclude workspace packages/
# from the core distribution archive.
[tool.hatch.build.targets.sdist]
include = [
    "/src/cliffracer",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.hatch.version]
source = "vcs"

[project]
name = "cliffracer"
dynamic = ["version"]
description = "Reliable RPC and event routing between Python services over NATS"
authors = [
    {name = "Cliffracer Contributors", email = "contact@cliffracer.dev"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Communications",
    "Framework :: AsyncIO",
]

# Core dependencies. PyYAML is required by `cliffracer run --config` via the [cli] extra.
dependencies = [
    "nats-py>=2.15.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "loguru>=0.7.0,<1.0.0",
]

[project.scripts]
cliffracer = "cliffracer.cli:main"
cliffracer-generate-client = "cliffracer.generate_client.cli:main"

[project.optional-dependencies]
# `cliffracer run --config` reads YAML. Nothing else in core does, and
# `cliffracer run` without --config never imports it.
cli = [
    "PyYAML>=6.0,<7.0",
]
msgpack = [
    "msgpack>=1.0.0,<2.0.0",
]
# Kept in sync with [dependency-groups].dev below: the group is uv-native and
# installed by default, the extra is the documented pip path. Change both.
dev = [
    "PyYAML>=6.0,<7.0",  # the [cli] extra, so the suite can exercise --config
    "msgpack>=1.0.0,<2.0.0",  # the [msgpack] extra, so test suite can exercise msgpack
    "types-PyYAML>=6.0.12",
    "types-croniter>=6.0.0",
    "types-psutil>=7.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-mock>=3.14.1,<4.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pytest-cov>=6.2.1,<7.0.0",
    "mypy>=1.10.0,<2.0.0",
    "ruff>=0.5.0,<1.0.0",
    # Needed by examples executed in CI.
    "aiohttp>=3.9.0,<4.0.0",
    "email-validator>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/sndwch/cliffracer"
Documentation = "https://github.com/sndwch/cliffracer/tree/main/docs"
Repository = "https://github.com/sndwch/cliffracer"
Issues = "https://github.com/sndwch/cliffracer/issues"

[dependency-groups]
# Installed by default by `uv sync`. Kept in sync with the [dev] extra above;
# see the note there.
dev = [
    "PyYAML>=6.0,<7.0",  # the [cli] extra, so the suite can exercise --config
    "msgpack>=1.0.0,<2.0.0",  # the [msgpack] extra, so test suite can exercise msgpack
    "types-PyYAML>=6.0.12",
    "types-croniter>=6.0.0",
    "types-psutil>=7.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-mock>=3.14.1,<4.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pytest-cov>=6.2.1,<7.0.0",
    "mypy>=1.10.0,<2.0.0",
    "ruff>=0.5.0,<1.0.0",
    # Needed by examples executed in CI.
    "aiohttp>=3.9.0,<4.0.0",
    "email-validator>=2.0.0,<3.0.0",
]
release = [
    "python-semantic-release>=10.0.0,<11.0.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --import-mode=importlib"
testpaths = ["tests", "packages"]
markers = [
    "unit: Unit tests that don't require external dependencies",
    "integration: Integration tests that may require external services",
    "nats_required: Tests that require a running NATS server",
    "slow: Tests that take a long time to run",
    "benchmark: Performance benchmarks; not a correctness gate",
    "repo: Guards over the repository itself (docs, packaging, CI, the suite)",
]
asyncio_mode = "auto"
# Global per-test timeout ceiling to prevent suite hangs on blocked calls.
timeout = 120
# Use signal-based timeouts (SIGALRM) to interrupt hanging coroutines and
# report individual test failures while preserving the test runner summary.
timeout_method = "signal"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # Treat PytestCollectionWarning as an error so uncollected test classes fail
    # collection loudly rather than being skipped silently.
    "error::pytest.PytestCollectionWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "examples/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".agents"]


[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
files = ["src", "packages/*/src"]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["msgpack.*", "aioconsole.*"]
ignore_missing_imports = true

[tool.semantic_release]
# hatch-vcs derives the version from the git tag, so semantic-release tags only.
tag_format = "v{version}"

# Required by python-semantic-release configuration schema even when runs
# use --no-commit.
commit_message = "chore(release): v{version} [skip ci]"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
# "update" inserts releases at the insertion_flag rather than regenerating
# CHANGELOG.md from git history.
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.remote]
type = "github"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cliffracer = { workspace = true }
